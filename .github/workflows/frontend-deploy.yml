name: Deploy Frontend to AWS

# 1. Trigger rules: Only run when the main branch changes AND the change is in the frontend folder
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"

# 2. Security: This is the magic block that enables OIDC (Zero-Trust Authentication)
permissions:
  id-token: write # Required to request the JWT token from GitHub to AWS
  contents: read # Required to read your repository code

jobs:
  deploy-production:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # Step A: Download your code onto the GitHub runner server
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step B: Securely log into AWS without passwords
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      # Step C: Inject the API URL into your config.js dynamically
      - name: Inject Environment Variables
        run: |
          echo "Injecting API Gateway URL into config..."
          sed -i "s|REPLACE_ME_AT_DEPLOYMENT|${{ secrets.API_GATEWAY_URL }}|g" ./frontend/config.js

      # Step D: Sync the files to the private S3 bucket
      - name: Sync S3 Bucket
        run: |
          echo "Uploading files to S3..."
          aws s3 sync ./frontend s3://${{ secrets.S3_BUCKET_NAME }} --delete

      # Step E: Tell the CDN to serve the new files immediately
      - name: Invalidate CloudFront Cache
        run: |
          echo "Clearing CloudFront edge cache..."
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} --paths "/*"
